# Este "workflow" le dice a GitHub qué hacer cada vez que subís cambios:
# construir el sitio con Astro y publicarlo en GitHub Pages.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicarlo a mano desde la pestaña Actions
  schedule:
    # Cada 3 horas vuelve a publicar el sitio para traer las reservas nuevas
    # de Airbnb y Booking (la hora es UTC, 3 horas más que en Argentina)
    - cron: '0 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Traer las fechas ocupadas de Airbnb y Booking
        run: node scripts/sincronizar-calendarios.mjs
        env:
          # Los links privados de los calendarios se guardan como secretos del repo
          AIRBNB_ICAL: ${{ secrets.AIRBNB_ICAL }}
          BOOKING_ICAL: ${{ secrets.BOOKING_ICAL }}
      - name: Construir el sitio con Astro
        uses: withastro/action@v3
        with:
          node-version: 24 # la misma versión de Node que tenés en tu compu

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
